<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Flipper</title>
    <style>
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .image-container {
            position: relative;
            width: 80%;
            max-width: 600px;
            perspective: 1000px;
        }
        .flip-card {
            position: relative;
            width: 100%;
            height: auto;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            cursor: pointer;
        }
        .flip-card img {
            width: 100%;
            border-radius: 10px;
            position: absolute;
            backface-visibility: hidden;
        }
        .flip-card .front {
            z-index: 2;
            transform: rotateY(0deg);
        }
        .flip-card .back {
            transform: rotateY(180deg);
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }
        .arrow.left {
            left: -100px;
        }
        .arrow.right {
            right: -100px;
        }
    
    </style>
</head>
<body>

<div class="image-container">
    <span class="arrow left">&#8592;</span>
    <div class="flip-card" id="flipCard">
        <img class="front" id="imageFront" src="" alt="Front Image">
        <img class="back" id="imageBack" src="" alt="Back Image">
    </div>
    <span class="arrow right">&#8594;</span>
</div>

<script>
    let images = [];
    let currentIndex = 0;

    const flipCard = document.getElementById('flipCard');
    const imageFront = document.getElementById('imageFront');
    const imageBack = document.getElementById('imageBack');

        // Function to fetch images from the Azure Function
    async function fetchImages() {
        const response = await fetch('https://instagramintegration.azurewebsites.net/api/instagramintegration?code=pIjCU18HwUYY1RytFwx0_gxhcDKINpfvOJvcwQjz39BSAzFufaUxoA%3D%3D');
        images = await response.json();        
        if (images.length > 0) {
            updateImages();
        }
    }

    // Function to update the displayed images
    function updateImages() {
        imageFront.src = images[currentIndex];
        imageBack.src = images[(currentIndex + 1) % images.length];
    }

    // Function to flip the card
    function flipCardImage() {
        flipCard.style.transform = "rotateY(180deg)";
        setTimeout(() => {
            currentIndex = (currentIndex + 1) % images.length;
            updateImages();
            flipCard.style.transform = "rotateY(0deg)";
        }, 400);
    }

    // Event listeners for arrow clicks
    document.querySelector('.arrow.left').addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        flipCardImage();
    });

    document.querySelector('.arrow.right').addEventListener('click', () => {
        flipCardImage();
    });

    // Swipe functionality
    let startX = 0;

    flipCard.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
    });

    flipCard.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].clientX;
        if (startX - endX > 50) {
            // Swiped left
            flipCardImage();
        } else if (endX - startX > 50) {
            // Swiped right
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            flipCardImage();
        }
    });

    // Fetch images on page load
    window.onload = fetchImages;

</script>

</body>
</html>
