<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Flipper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .image-container {
            position: relative;
            width: 80%;
            max-width: 600px;
        }
        .image-container img {
            width: 100%;
            border-radius: 10px;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }
        .arrow.left {
            left: 10px;
        }
        .arrow.right {
            right: 10px;
        }
    </style>
</head>
<body>

<div class="image-container">
    <span class="arrow left">&#8592;</span>
    <img id="imageDisplay" src="https://via.placeholder.com/600x400?text=Image+1" alt="Image">
    <span class="arrow right">&#8594;</span>
</div>

<script>
    // Array of image URLs

    const response = await fetch('https://instagramintegration.azurewebsites.net/api/instagramintegration?code=pIjCU18HwUYY1RytFwx0_gxhcDKINpfvOJvcwQjz39BSAzFufaUxoA%3D%3D');
    const images = await response.json();

    let currentIndex = 0;

    const imageDisplay = document.getElementById('imageDisplay');
    const leftArrow = document.querySelector('.arrow.left');
    const rightArrow = document.querySelector('.arrow.right');

    // Function to update the displayed image
    function updateImage(index) {
        imageDisplay.src = images[index];
    }

    // Event listeners for arrow clicks
    leftArrow.addEventListener('click', () => {
        currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
        updateImage(currentIndex);
    });

    rightArrow.addEventListener('click', () => {
        currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
        updateImage(currentIndex);
    });

    // Swipe functionality
    let startX = 0;

    imageDisplay.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
    });

    imageDisplay.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].clientX;
        if (startX - endX > 50) {
            // Swiped left
            currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
            updateImage(currentIndex);
        } else if (endX - startX > 50) {
            // Swiped right
            currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
            updateImage(currentIndex);
        }
    });

    // Keyboard arrow functionality
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
            currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
            updateImage(currentIndex);
        } else if (e.key === 'ArrowRight') {
            currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
            updateImage(currentIndex);
        }
    });
</script>

</body>
</html>
